# ════════════════════════════════════════════════════════════════
# Nginx Production Configuration for Reset Primal
# ════════════════════════════════════════════════════════════════
# This config is used in docker-compose.production.yml
# For non-Docker production, see docs/NGINX_AUTH_REQUEST.md

upstream backend {
  server backend:3000;
  keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# ════════════════════════════════════════════════════════════════
# Redirect HTTP to HTTPS
# ════════════════════════════════════════════════════════════════
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Allow Let's Encrypt ACME challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all other traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ════════════════════════════════════════════════════════════════
# HTTPS Server
# ════════════════════════════════════════════════════════════════
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name resetprimal.com.br www.resetprimal.com.br;

  # ════════════════════════════════════════════════════════════════
  # SSL Configuration
  # ════════════════════════════════════════════════════════════════
  ssl_certificate /etc/letsencrypt/live/resetprimal.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/resetprimal.com.br/privkey.pem;

  # Modern configuration from Mozilla SSL Configuration Generator
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # HSTS (HTTP Strict Transport Security)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # ════════════════════════════════════════════════════════════════
  # Security Headers
  # ════════════════════════════════════════════════════════════════
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # ════════════════════════════════════════════════════════════════
  # Auth Request Subrequest
  # ════════════════════════════════════════════════════════════════
  location = /api/auth/verify-access {
    internal;
    proxy_pass http://backend;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
  }

  # ════════════════════════════════════════════════════════════════
  # Protected E-book
  # ════════════════════════════════════════════════════════════════
  location /ebook/ {
    auth_request /api/auth/verify-access;
    error_page 401 = @error401;
    error_page 403 = @error403;

    root /var/www/reset-primal;
    try_files $uri $uri/ =404;

    add_header Cache-Control "private, no-cache, must-revalidate";
    add_header X-Content-Type-Options nosniff;
  }

  # ════════════════════════════════════════════════════════════════
  # Error Handlers
  # ════════════════════════════════════════════════════════════════
  location @error401 {
    return 302 /login?redirect=$request_uri;
  }

  location @error403 {
    return 403 "Access Denied";
  }

  # ════════════════════════════════════════════════════════════════
  # API Endpoints
  # ════════════════════════════════════════════════════════════════
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://backend;
    proxy_http_version 1.1;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ════════════════════════════════════════════════════════════════
  # Webhook
  # ════════════════════════════════════════════════════════════════
  location /webhook/ {
    limit_req zone=general_limit burst=50 nodelay;

    proxy_pass http://backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ════════════════════════════════════════════════════════════════
  # Health Check
  # ════════════════════════════════════════════════════════════════
  location /health {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    access_log off;
  }

  # ════════════════════════════════════════════════════════════════
  # Public Frontend
  # ════════════════════════════════════════════════════════════════
  location / {
    limit_req zone=general_limit burst=50 nodelay;

    proxy_pass http://backend;
    proxy_http_version 1.1;

    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ════════════════════════════════════════════════════════════════
  # Static Files Caching
  # ════════════════════════════════════════════════════════════════
  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # ════════════════════════════════════════════════════════════════
  # Deny Access to Sensitive Files
  # ════════════════════════════════════════════════════════════════
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
  }
}
