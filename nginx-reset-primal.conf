# Nginx Configuration para Reset Primal
# INSTALAR EM: /etc/nginx/sites-available/reset-primal
# DEPOIS: sudo ln -s /etc/nginx/sites-available/reset-primal /etc/nginx/sites-enabled/

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name resetprimal.com.br www.resetprimal.com.br;
    return 301 https://$server_name$request_uri;
}

# HTTPS - Production
server {
    listen 443 ssl http2;
    server_name resetprimal.com.br www.resetprimal.com.br;

    # SSL Certificates (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/resetprimal.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resetprimal.com.br/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval' www.googletagmanager.com www.google-analytics.com connect.facebook.net;" always;

    # Root directory
    root /Users/acacioamaro/Projects/reset-primal/landing-page;
    index index.html;

    # ========== LANDING PAGE ==========
    location / {
        try_files $uri $uri/ =404;

        # Cache assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ========== WEBHOOK HOTMART ==========
    location /webhook/hotmart {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========== HEALTH CHECK ==========
    location /health {
        proxy_pass http://localhost:3000;
        access_log off;
    }

    # ========== PÁGINAS ESTÁTICAS ==========
    location /sucesso {
        rewrite ^/sucesso/?$ /sucesso.html break;
    }

    location /erro {
        rewrite ^/erro/?$ /erro.html break;
    }

    # ========== DENY ==========
    location ~ /\. {
        deny all;
    }

    location ~ ~$ {
        deny all;
    }
}
