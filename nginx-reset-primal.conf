# NGINX Configuration for Reset Primal
# Production-ready with SSL, Gzip, Caching, Security Headers
# Servidor: 64.225.44.199

# Global HTTP context configuration
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name resetprimal.com.br www.resetprimal.com.br;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS (SSL) - Main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name resetprimal.com.br www.resetprimal.com.br;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/resetprimal.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resetprimal.com.br/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Root directory
    root /var/www/reset-primal/landing-page;
    index index.html;

    # ============================================
    # 1. GZIP COMPRESSION (CRÍTICO)
    # ============================================
    # Comprime resposta em 80-90% para texto
    # Ganho: +5-7 pontos PageSpeed
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/javascript
               application/json application/javascript
               application/xml+rss application/atom+xml
               image/svg+xml;
    gzip_vary on;
    gzip_disable "msie6";

    # ============================================
    # 2. CACHE HEADERS (CRÍTICO)
    # ============================================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html?$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* ^/api/ {
        expires 5m;
        add_header Cache-Control "private, max-age=300";
        proxy_pass http://localhost:3001;
    }

    # ============================================
    # 3. SECURITY HEADERS
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://www.facebook.com;" always;

    # ============================================
    # 4. RATE LIMITING
    # ============================================
    limit_req zone=api_limit burst=20 nodelay;

    # ============================================
    # 5. ROUTES
    # ============================================
    location /webhook/hotmart {
        proxy_pass http://localhost:3001/webhook/hotmart;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /sucesso {
        rewrite ^/sucesso/?$ /sucesso.html last;
    }

    location /erro {
        rewrite ^/erro/?$ /erro.html last;
    }

    location / {
        try_files $uri $uri/ /index-otimizado.html;
    }

    # ============================================
    # 6. LOGGING
    # ============================================
    access_log /var/log/nginx/reset-primal-access.log combined buffer=32k;
    error_log /var/log/nginx/reset-primal-error.log warn;
}
