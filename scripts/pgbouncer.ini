[databases]
# Database mappings for PgBouncer
reset_primal_prod = host=DATABASE_HOST port=5432 dbname=reset_primal_prod user=app_user password=APP_USER_PASSWORD
# Replica for read-only queries (optional)
# reset_primal_replica = host=REPLICA_HOST port=5432 dbname=reset_primal_prod user=app_user password=APP_USER_PASSWORD

[pgbouncer]
# PgBouncer Listening
listen_port = 6432
listen_addr = *
unix_socket_dir = /var/run/pgbouncer
admin_users = postgres, pgbouncer_admin
stats_users = stats_viewer

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, password FROM pg_user WHERE usename = $1

# Connection Pooling Configuration
pool_mode = transaction
# transaction: Connection returned to pool after each transaction
# session: Connection reserved for each client until client disconnects
# statement: Connection returned to pool after each query (not recommended for transactions)

# Pool Sizes
min_pool_size = 10
default_pool_size = 25
max_pool_size = 100
reserve_pool_size = 5
reserve_pool_timeout = 3

# Connection Limits Per Client/User
max_client_conn = 100
max_user_connections = 50
max_db_connections = 100

# Timeouts (in seconds)
connect_timeout = 600
idle_in_transaction_session_timeout = 60
idle_session_timeout = 600
server_idle_timeout = 600
query_timeout = 30
query_wait_timeout = 120
max_idle_connections = 60

# Logging
syslog = 1
syslog_facility = LOG_LOCAL0
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60
verbose = 1

# Performance & Behavior
server_lifetime = 3600        # Close server connections after 1 hour
server_idle_timeout = 600     # Close idle server connections
auto_db_idle_timeout = 60     # Auto-close idle db connections
dns_max_ttl = 15              # DNS cache TTL
dns_zone_check_period = 0     # Disable zone checks
disable_pqexec = 0            # Allow PQexec for prepared statements
application_name_add_host = 1 # Add host to application_name

# Advanced
max_db_connections = 100
max_user_connections = 50
server_connect_timeout = 15
server_check_query = select 1
server_check_delay = 10
server_fast_close = 0         # Properly close server connections

# SSL Settings (Optional - requires certs)
# ssl = require
# ssl_key_file = /etc/pgbouncer/pgbouncer.key
# ssl_cert_file = /etc/pgbouncer/pgbouncer.crt
# ssl_ca_file = /etc/pgbouncer/ca.crt
# ssl_sslmode = require

# Connection String Rewriting
# client_tls_sslmode = require

# Statistics
stats_users = stats

# Maintenance
maintenance_db = pgbouncer
