version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resetprimal-db
    environment:
      POSTGRES_USER: resetprimal
      POSTGRES_PASSWORD: senha_super_segura_2025
      POSTGRES_DB: resetprimal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resetprimal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
